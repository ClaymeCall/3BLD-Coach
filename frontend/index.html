<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>3BLD Coach Web UI</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>3BLD Coach</h1>
    <section id="scramble-section">
        <h2>Generate Scramble</h2>
        <label>Length: <input type="number" id="scramble-length" value="25" min="1" max="100"></label>
        <button id="scramble-btn">Generate</button>
        <pre id="scramble-output"></pre>
    </section>
    <section id="memo-section">
        <h2>Memo (placeholder)</h2>
        <button id="memo-btn">Start Session</button>
        <pre id="memo-output"></pre>
    </section>
    <script src="app.js"></script>
</body>
</html>
